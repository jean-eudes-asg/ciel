name: Release

# Pushing a version tag (v0.1.0, v0.2.0…) builds the Windows installers and the
# Linux packages, then publishes them as a GitHub release, with SHA256SUMS and
# the changelog's section for that version as the notes. The tag must match the
# version in src-tauri/tauri.conf.json. A release that already exists (published
# by hand from a local build, which creates its tag) is left as it is.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.look.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is already released: nothing to build."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in tauri.conf.json"
            exit 1
          fi

  build:
    needs: check
    if: needs.check.outputs.released != 'true'
    strategy:
      matrix:
        # Linux builds on the oldest supported Ubuntu, so the packages run on
        # any glibc from 22.04 on.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # WebKitGTK and the libraries the app links (tray, layer-shell, audio,
      # Secret Service); patchelf for the AppImage's media plugin.
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libasound2-dev libpulse-dev libdbus-1-dev \
            libgtk-layer-shell-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ciel-release-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ciel-release-cargo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Front-end tests
        run: npm test

      # The app bundles target/release/ciel-hook(.exe); its build script needs it first.
      - name: Build the relay
        run: cargo build --release -p ciel-hook

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build the packages
        run: npm run pack

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          pattern: packages-*
          path: release
          merge-multiple: true

      # The extension that brings websites' notifications to the island; loaded
      # unpacked from this zip (Settings → Integrations → Notifications).
      - name: Ciel for Chrome
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd extension && zip -r -X "../release/Ciel-for-Chrome-$version.zip" .)
          cp "release/Ciel-for-Chrome-$version.zip" release/Ciel-for-Chrome.zip

      - name: Checksums and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release
          sha256sum *"-$version"* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # The lines between "## [<version>]" and the next "## [" (or the links),
          # then one line per paragraph and list item: GitHub shows every line break.
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || index($0, "[") == 1 && index($0, "]: ") > 0) { exit }
            on { print }
          ' CHANGELOG.md | awk '
            /^$/ || /^#/ { if (buf != "") print buf; buf = ""; print; next }
            /^- / { if (buf != "") print buf; buf = $0; next }
            { line = $0; sub(/^ +/, "", line); buf = (buf == "" ? line : buf " " line) }
            END { if (buf != "") print buf }
          ' > release-notes.md
          {
            echo
            echo "**Try it first in your browser:** https://jean-eudes-asg.github.io/ciel/#try"
            echo
            echo "**Windows will warn you the first time:** the installer isn't code-signed yet. Click **More info**, then **Run anyway**. Check a download with \`SHA256SUMS\`."
            echo
            echo "**Linux:** the \`.deb\` (Debian, Ubuntu 22.04+), the \`.rpm\` (Fedora) or the AppImage (anywhere else)."
            echo
            echo "**Ciel for Chrome:** \`Ciel-for-Chrome.zip\` brings websites' notifications (Chrome, Edge, Brave) to the island. Connect it in Settings → Integrations → Notifications, then load it unpacked in \`chrome://extensions\`."
          } >> release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Ciel $version" \
            --notes-file release-notes.md \
            release/*
