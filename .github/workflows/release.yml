name: Release

# Pushing a version tag (v0.1.0, v0.2.0…) builds the Windows installers and
# publishes them as a GitHub release, with SHA256SUMS and the changelog's
# section for that version as the notes. The tag must match the version in
# src-tauri/tauri.conf.json. A release that already exists (published by hand
# from a local build, which creates its tag) is left as it is.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.look.outputs.released }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "$GITHUB_REF_NAME is already released: nothing to build."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.released != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ciel-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ciel-release-cargo-

      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in tauri.conf.json"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Front-end tests
        run: npm test

      # The app bundles target/release/ciel-hook.exe; its build script needs it first.
      - name: Build the relay
        run: cargo build --release -p ciel-hook

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build the installers
        run: npm run pack

      - name: Checksums and release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release
          sha256sum "Ciel-Windows-$version-setup.exe" "Ciel-Windows-$version.msi" > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # The lines between "## [<version>]" and the next "## [" (or the links),
          # then one line per paragraph and list item: GitHub shows every line break.
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && (index($0, "## [") == 1 || index($0, "[") == 1 && index($0, "]: ") > 0) { exit }
            on { print }
          ' CHANGELOG.md | awk '
            /^$/ || /^#/ { if (buf != "") print buf; buf = ""; print; next }
            /^- / { if (buf != "") print buf; buf = $0; next }
            { line = $0; sub(/^ +/, "", line); buf = (buf == "" ? line : buf " " line) }
            END { if (buf != "") print buf }
          ' > release-notes.md
          {
            echo
            echo "**Try it first in your browser:** https://jean-eudes-asg.github.io/ciel/#try"
            echo
            echo "**Windows will warn you the first time:** the installer isn't code-signed yet. Click **More info**, then **Run anyway**. Check a download with \`SHA256SUMS\`."
          } >> release-notes.md
          cat release-notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Ciel $version" \
            --notes-file release-notes.md \
            "release/Ciel-Windows-$version-setup.exe" \
            "release/Ciel-Windows-$version.msi" \
            "release/Ciel-Windows-setup.exe" \
            "release/Ciel-Windows.msi" \
            release/SHA256SUMS
