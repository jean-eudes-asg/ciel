<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ciel — plan rings preview</title>
    <style>
      body { margin: 0; padding: 24px 0 120px; background: #1b1b1f; font: 12px system-ui; color: #ddd; }
      h1 { font: 600 14px system-ui; text-align: center; margin: 0 0 18px; }
      .cases { display: flex; flex-direction: column; align-items: center; gap: 34px; }
      .case { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      /* A folded island: the real rings and card, on a 288×32 strip. */
      .strip { position: relative; width: 288px; height: 32px; background: #000; border-radius: 0 0 14px 14px; }
      .strip .ciel { position: absolute; left: 30px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: #f5f6f8; }
      .gap { height: 150px; }
    </style>
  </head>
  <body>
    <h1>Plan usage rings in the folded island (src/views/plan-rings.ts)</h1>
    <div class="cases" id="cases"></div>
    <script type="module" src="./rings-preview.ts"></script>
  </body>
</html>
