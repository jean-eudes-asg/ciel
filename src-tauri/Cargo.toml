[package]
name = "ciel"
description = "Ciel for Windows and Linux: a little cloud at the top of your screen that watches your AI coding agents"
authors = ["jean-eudes-asg"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ciel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Gmail (gmail.rs): IMAP over TLS, on the same rustls (ring) reqwest brings,
# and the charsets mail headers and bodies come in.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
encoding_rs = "0.8"
base64 = "0.22"
futures-util = "0.3"
# SHA-256 of the speech models as they download (speech/mod.rs). Already in the
# tree through reqwest's rustls.
ring = "0.17"
# Flow dictation and the Notetaker (flow/, notes/, speech/). Speech to text runs
# on this computer: sherpa-onnx (Apache-2.0) with NVIDIA's Parakeet, linked
# statically (onnxruntime included), the models downloaded on the user's click.
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["static"] }
# Kitten, « OK Ciel »'s voice on this computer, comes as a .tar.bz2 from
# sherpa-onnx's releases (voice/kitten.rs). Both already in the tree: tar
# through the updater, bzip2 through sherpa-onnx's build script.
tar = "0.4"
bzip2 = "0.5"
# The microphone, and the computer's own sound for the Notetaker (WASAPI
# loopback on Windows, a PulseAudio/PipeWire monitor on Linux). Apache-2.0.
cpal = "0.18"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The island's file drop reads paths straight from WebView2 (webview_drop.rs).
# Same versions as wry, so nothing new is compiled.
webview2-com = "0.39"
wv2_core = { package = "windows-core", version = "0.62" }
windows = { version = "0.61", features = [
  # The Spotify pill: the system media controls Spotify publishes to.
  "Foundation",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  # The Spotify pill's volume: Spotify's session in the Windows mixer.
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Com",
  # "Open terminal": the relay's process tree leads to the session's window.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # Flow dictation's keyboard hook.
  "Win32_System_LibraryLoader",
  # Wallpapers (wallpaper/): the lock screen through WinRT, the live window
  # behind the desktop icons, and what pauses it (power, session, display).
  "Storage",
  "System_UserProfile",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_UI_Shell_Common",
] }
# The clipboard for Flow dictation, kept out of the clipboard history. MIT/Apache-2.0.
arboard = { version = "3.6", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# libdbus, which keyring's Secret Service already links, so nothing new is
# downloaded: Wayland global shortcuts through the XDG GlobalShortcuts portal
# (portal.rs), the Spotify pill over MPRIS (spotify.rs) and "Open terminal"
# through KWin's scripting (platform/linux_focus.rs).
dbus = "0.9.12"
# EWMH on X11 for "Open terminal", already in the tree (global-hotkey).
x11rb = { version = "0.13", default-features = false, features = ["xinput", "xtest", "screensaver"] }
# PulseAudio (or PipeWire's PulseAudio server) for the microphone list and the
# monitor of the speakers, the Notetaker's "computer sound". Pure Rust client.
cpal = { version = "0.18", features = ["pulseaudio"] }
# The clipboard for Flow dictation (X11, and Wayland's data-control protocol).
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# Tests only: the extension id Chrome derives from its manifest key (browser_bridge.rs).
[dev-dependencies]
sha2 = "0.10"
